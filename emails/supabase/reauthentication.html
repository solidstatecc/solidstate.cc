<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a0a0a" style="background-color:#0a0a0a">
  <tr>
    <td align="center" style="padding:48px 24px">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="520" style="max-width:520px;width:100%">
        <tr>
          <td style="padding:0 0 28px">
            <img src="https://solidstate.b-cdn.net/BRANDING/logo_white.png" alt="SOLID STATE" width="150" style="display:block;border:0" />
          </td>
        </tr>
        <tr>
          <td style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;color:#ffffff;letter-spacing:-0.02em;padding:0 0 12px">Your code.</td>
        </tr>
        <tr>
          <td style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;color:#aaaaaa;padding:0 0 28px">Enter it to confirm. It expires fast.</td>
        </tr>
        <tr>
          <td style="padding:0 0 32px">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#161616" style="border:1px solid #2a2a2a;padding:16px 24px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:.3em;color:#ffffff">{{ .Token }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:#666666">Didn't request this? Ignore it.<br />solidstate.cc &middot; hi@solidstate.cc</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
